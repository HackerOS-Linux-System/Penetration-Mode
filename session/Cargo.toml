[package]
name = "penetration-mode-session"
version = "0.1.0"
edition = "2021"
description = "Session launcher for Penetration Mode - decides whether to hand off to `hackeros-comp --extern-penetration-mode` (bare-tty / full-session mode) or to launch the Tauri shell directly as an ordinary nested app (`penetration-mode app` / `--other`). Analogous to Hacker Mode's `hacker-mode-session` launcher (see hackeros-comp's main.rs module doc). NOT the GUI app itself - that's `source-code/backend` (the Tauri binary); this binary's only job is picking how that binary (or hackeros-comp, hosting it) gets started."
license = "BSD-3-Clause"

[[bin]]
name = "penetration-mode"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Vendored copy of hackeros-comp's --extern-<name> wire protocol — see
# vendor/penetration-mode-ipc/Cargo.toml's description for why it's
# vendored rather than a path/git dependency straight into the
# hackeros-comp repository, and why there's no separate "sde"/"sde-ipc"
# crate in between: this is the only IPC crate main.rs depends on. It
# talks to hackeros-comp generically via `penetration_mode_ipc::protocol`
# (same window-lifecycle code for both the `penetration-mode` and `other`
# extern names), so it doesn't lean on that crate's
# `penetration-mode`-specific convenience wrappers
# (`launch_shell`/`find_shell_window`/`enter_wrapper`/...) here — those
# stay ready in the same crate for whenever a BlackArch-store-tool
# "wrapper mode" (see that crate's own module doc) gets built on top of
# this launcher, but aren't pulled in until something actually calls them.
penetration-mode-ipc = { path = "vendor/penetration-mode-ipc" }
